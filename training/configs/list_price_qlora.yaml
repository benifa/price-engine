# QLoRA list-price specialist — Colab full-mode hyperparameters
# (Ed Donner week-7 LITE_MODE=False recipe; see docs/TRAINING.md)
#
# Data: ed-donner/items_prompts_full (800k train) — Hub load inside Modal.
# Eval golden: data/golden/amazon.parquet (lite test).
# Format: amazon_list (question + text + "Price is $") — already baked into Hub rows.
name: list_price_qlora
base_model: meta-llama/Llama-3.2-3B
hub_model_id: null

dataset:
  hub_id: ed-donner/items_prompts_full
  val_split: val
  val_size: 1000

modal:
  gpu: A100-40GB

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora:
  r: 256
  lora_alpha: 512
  lora_dropout: 0.1
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  num_train_epochs: 3
  per_device_train_batch_size: 256
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.01
  optim: paged_adamw_32bit
  max_grad_norm: 0.3
  weight_decay: 0.001
  bf16: true
  fp16: false
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  seed: 42
  completion_only: true
  group_by_length: true

token_budget:
  max_seq_length: 128

early_stop:
  enabled: false

wandb:
  enabled: false
  tags: [qlora, llama-3.2-3b, amazon, list-price]
