# R3 — capacity ablation: r=64, α=128 (keep α/r = 2).
name: all_linear_r64
base_model: meta-llama/Llama-3.2-3B
prompt_style: ours

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora:
  r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  optim: paged_adamw_32bit
  max_grad_norm: 0.3
  weight_decay: 0.0
  bf16: true
  fp16: false
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  seed: 42
  completion_only: true
  response_template: "Price is $"

token_budget:
  summary_cutoff: 110
  max_seq_length: 220

early_stop:
  enabled: true
  patience: 3
  val_sample_size: 500
  metric: mae

wandb:
  enabled: true
  tags: [qlora, llama-3.2-3b, sold-comps, all-linear, r64, r3]
