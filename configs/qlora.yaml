# QLoRA list-price specialist — see docs/TRAINING.md
#
# Data (preferred): benifa/items_prompts_full — Hub load inside Modal.
# Fallback: set hub_id: null and use /data/hf_dataset from
#   `priceengine prepare-data` → `priceengine build-local-sft`
# Eval golden: data/golden/amazon.parquet (lite test).
# Format: list_price (question + text + "Price is $").
# Checkpoint: /data/checkpoints/list_price_qlora
# Prefer `priceengine publish-model --tag vX.Y.Z` after eval for versioned Hub releases.
# Optional one-shot push during train (no tag / model card): set hub_model_id below.
name: list_price_qlora
base_model: meta-llama/Llama-3.2-3B
hub_model_id: null  # e.g. benifa/list-price-qlora — or leave null and use CLI publish

dataset:
  hub_id: benifa/items_prompts_full  # null → local_dir fallback
  local_dir: /data/hf_dataset        # from build-local-sft (Modal volume)
  val_split: val
  val_size: 1000

modal:
  gpu: A100-40GB

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora:
  r: 256
  lora_alpha: 512
  lora_dropout: 0.1
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  num_train_epochs: 3
  per_device_train_batch_size: 256
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.01
  optim: paged_adamw_32bit
  max_grad_norm: 0.3
  weight_decay: 0.001
  bf16: true
  fp16: false
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  seed: 42
  completion_only: true
  group_by_length: true

token_budget:
  max_seq_length: 128

early_stop:
  enabled: false

wandb:
  enabled: false
  tags: [qlora, llama-3.2-3b, amazon, list-price]
