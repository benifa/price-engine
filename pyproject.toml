[project]
name = "price-engine"
version = "0.1.0"
description = "Calibrated secondhand valuation from a bare description — QLoRA specialist trained on sold prices, fair eval vs ed-donner/price-2025-11-28."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "apify-client>=1.8",
    "chromadb>=1.1.0",
    "datasets>=3.0",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "modal>=1.1.4",
    "numpy>=2.0",
    "openai>=1.109.1",
    "pandas>=2.2",
    "peft>=0.14",
    "pyarrow>=17.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "sentence-transformers>=5.1.1",
    "torch>=2.8.0",
    "transformers>=4.46",
    "trl>=0.12",
    "typer>=0.15",
    "wandb>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
priceengine = "priceengine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/priceengine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
