[project]
name = "price-engine"
version = "0.1.0"
description = "Amazon list-price QLoRA specialist with fair eval vs ed-donner/price-2025-11-28."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "datasets>=3.0",
    "huggingface_hub>=0.26",
    "modal>=1.1.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "peft>=0.14",
    "plotly>=5.24",
    "pyarrow>=17.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "torch>=2.8.0",
    "transformers>=4.46",
    "trl>=0.12",
    "typer>=0.15",
    "wandb>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
frontier = [
    "openai>=1.40",
]

[project.scripts]
priceengine = "priceengine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/priceengine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
